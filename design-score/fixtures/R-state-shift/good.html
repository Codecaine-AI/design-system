<!doctype html>
<!-- R-state-shift, good: the same Sort menu, positioned over the list. Opening it moves nothing. -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>R-state-shift: good</title>
<link rel="stylesheet" href="../../../css/fonts.css">
<link rel="stylesheet" href="../../../dist/css/tokens.css">
<style>
  body { margin: 0; padding: var(--ds-space-6); background: var(--ds-color-surface-page); color: var(--ds-color-text-body); font-family: var(--ds-font-family-sans); }
  .panel { width: calc(var(--ds-space-16) * 6); }
  .head { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: var(--ds-space-2); }
  h2 { margin: 0; font-size: var(--ds-font-size-ui-lg); line-height: var(--ds-space-8); font-weight: var(--ds-font-weight-semibold); }
  .sort { display: flex; flex-direction: column; align-items: flex-end; }
  .btn { min-height: var(--ds-space-8); padding: 0 var(--ds-space-3); border: 1px solid var(--ds-color-border-default); border-radius: var(--ds-radius-base); background: var(--ds-color-surface-panel); color: var(--ds-color-text-body); font: inherit; font-size: var(--ds-font-size-ui-sm); }
  .menu { display: none; flex-direction: column; min-width: calc(var(--ds-space-16) * 2); padding: var(--ds-space-1); border: 1px solid var(--ds-color-border-default); border-radius: var(--ds-radius-base); background: var(--ds-color-surface-panel); }
  .menu.open { display: flex; }
  .item { min-height: var(--ds-space-8); padding: 0 var(--ds-space-2); border: 0; border-radius: var(--ds-radius-base); background: none; color: var(--ds-color-text-body); font: inherit; font-size: var(--ds-font-size-ui-sm); text-align: left; }
  .list { margin: 0; padding: 0; list-style: none; border: 1px solid var(--ds-color-border-default); border-radius: var(--ds-radius-base); background: var(--ds-color-surface-panel); }
  .list li { padding: var(--ds-space-2) var(--ds-space-3); font-size: var(--ds-font-size-ui-md); }
  .list li + li { border-top: 1px solid var(--ds-color-border-subtle); }
  /* The menu sits over the list, out of the flow, so opening it moves nothing. */
  .sort { position: relative; }
  .menu { position: absolute; top: calc(100% + var(--ds-space-1)); right: 0; z-index: 1; box-shadow: var(--ds-shadow-dialog); }
</style>
</head>
<body>
  <div class="panel">
    <div class="head">
      <h2>Tasks</h2>
      <div class="sort">
        <button class="btn" type="button" aria-haspopup="menu" aria-expanded="false" aria-controls="sort-menu">Sort</button>
        <div class="menu" id="sort-menu" role="menu">
          <button class="item" type="button" role="menuitem">By due date</button>
          <button class="item" type="button" role="menuitem">By name</button>
          <button class="item" type="button" role="menuitem">By area</button>
        </div>
      </div>
    </div>
    <ul class="list">
      <li>Review the spacing pass</li>
      <li>Write the release notes</li>
      <li>Fix the focus ring in dark mode</li>
    </ul>
  </div>
  <script>
    // A click on Sort opens or closes the menu. Escape closes it.
    const button = document.querySelector("[aria-haspopup]");
    const menu = document.querySelector(".menu");
    const set = (open) => {
      menu.classList.toggle("open", open);
      button.setAttribute("aria-expanded", String(open));
    };
    button.addEventListener("click", () => set(!menu.classList.contains("open")));
    document.addEventListener("keydown", (e) => { if (e.key === "Escape") set(false); });
  </script>
</body>
</html>
