<!doctype html>
<!-- R-hit-target, good: the same editor card. Every icon button is 32x32px, and the inline link in the note is exempt. -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>R-hit-target: good</title>
<link rel="stylesheet" href="../../../css/fonts.css">
<link rel="stylesheet" href="../../../dist/css/tokens.css">
<style>
  body { margin: 0; padding: var(--ds-space-6); background: var(--ds-color-surface-page); color: var(--ds-color-text-body); font-family: var(--ds-font-family-sans); }
  .card { width: calc(var(--ds-space-16) * 7); border: 1px solid var(--ds-color-border-default); border-radius: var(--ds-radius-base); background: var(--ds-color-surface-panel); }
  .head { display: flex; align-items: center; justify-content: space-between; padding: var(--ds-space-2) var(--ds-space-3); border-bottom: 1px solid var(--ds-color-border-subtle); }
  h2 { margin: 0; font-size: var(--ds-font-size-ui-lg); font-weight: var(--ds-font-weight-semibold); }
  .tools { display: flex; align-items: center; gap: var(--ds-space-1); padding: var(--ds-space-2) var(--ds-space-3); border-bottom: 1px solid var(--ds-color-border-subtle); }
  .tool, .close, .info { display: inline-flex; align-items: center; justify-content: center; padding: 0; border: 1px solid var(--ds-color-border-default); border-radius: var(--ds-radius-base); background: var(--ds-color-surface-panel); color: var(--ds-color-text-body); font: inherit; font-size: var(--ds-font-size-ui-sm); flex-shrink: 0; }
  .tool svg, .close svg, .info svg { width: var(--ds-space-3); height: var(--ds-space-3); }
  .note { display: flex; align-items: flex-start; justify-content: space-between; gap: var(--ds-space-16); padding: var(--ds-space-3); }
  .note p { margin: 0; font-size: var(--ds-font-size-ui-md); line-height: var(--ds-line-height-ui); }
  .note a { color: var(--ds-color-link); }
  /* Every target is 32x32px. */
  .tool, .close, .info { width: var(--ds-space-8); height: var(--ds-space-8); }
</style>
</head>
<body>
  <div class="card">
    <div class="head">
      <h2>Release notes</h2>
      <button class="close" type="button" aria-label="Close"><svg viewBox="0 0 12 12" aria-hidden="true"><path d="M2 2l8 8M10 2l-8 8" stroke="currentColor" stroke-width="1.5"/></svg></button>
    </div>
    <div class="tools">
      <button class="tool" type="button" aria-label="Bold"><b>B</b></button>
      <button class="tool" type="button" aria-label="Italic"><i>I</i></button>
      <button class="tool" type="button" aria-label="Underline"><u>U</u></button>
      <button class="tool" type="button" aria-label="Strikethrough"><s>S</s></button>
    </div>
    <div class="note">
      <p>Draft the notes for version 2.4 here. The <a href="#style">writing guide</a> lists the words to avoid.</p>
      <button class="info" type="button" aria-label="Help"><svg viewBox="0 0 12 12" aria-hidden="true"><circle cx="6" cy="6" r="5" fill="none" stroke="currentColor"/><path d="M6 5v4" stroke="currentColor" stroke-width="1.5"/><circle cx="6" cy="3.2" r="0.8" fill="currentColor"/></svg></button>
    </div>
  </div>
</body>
</html>
