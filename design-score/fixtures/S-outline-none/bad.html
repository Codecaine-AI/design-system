<!doctype html>
<!-- S-outline-none, bad: a toolbar whose CSS removes the focus outline from its buttons and its search field and puts nothing in its place (fail). The first button has keyboard focus and shows no ring. -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>S-outline-none: bad</title>
<link rel="stylesheet" href="../../../css/fonts.css">
<link rel="stylesheet" href="../../../dist/css/tokens.css">
<link rel="stylesheet" href="bad.css">
</head>
<body>
  <h2>Files</h2>
  <div class="toolbar">
    <button class="btn" type="button">Upload</button>
    <button class="btn" type="button">New folder</button>
    <input class="field" type="search" placeholder="Search files" aria-label="Search files">
  </div>
  <p class="label">bad.css, the focus rules the check reads</p>
  <pre class="source"></pre>
  <script>
    // Shows the stylesheet from its second comment on (the rules this fixture is about), with line numbers.
    const pre = document.querySelector(".source");
    fetch("bad.css").then((r) => r.text()).then((t) => {
      const lines = t.trimEnd().split("\n");
      const from = Math.max(0, lines.findIndex((l, i) => i > 0 && l.startsWith("/*")));
      pre.textContent = lines.slice(from).map((l, i) => String(from + i + 1).padStart(2) + "  " + l).join("\n");
      pre.classList.add("loaded");
    });
  </script>
</body>
</html>
