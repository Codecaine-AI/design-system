<!doctype html>
<!-- M-layout-props, good: a file view with a details panel that the page's action opens. The details panel has a fixed width and slides in with transform and opacity, and the button transitions only its background. -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>M-layout-props: good</title>
<link rel="stylesheet" href="../../../css/fonts.css">
<link rel="stylesheet" href="../../../dist/css/tokens.css">
<style>
  body { margin: 0; padding: var(--ds-space-6); background: var(--ds-color-surface-page); color: var(--ds-color-text-body); font-family: var(--ds-font-family-sans); }
  .view { position: relative; width: calc(var(--ds-space-16) * 7); height: calc(var(--ds-space-16) * 3); overflow: hidden; border: 1px solid var(--ds-color-border-default); border-radius: var(--ds-radius-base); background: var(--ds-color-surface-panel); }
  .main { padding: var(--ds-space-3); }
  .title { margin: 0 0 var(--ds-space-3); font-size: var(--ds-font-size-ui-lg); font-weight: var(--ds-font-weight-semibold); }
  .btn { height: var(--ds-space-8); padding: 0 var(--ds-space-3); border: 1px solid var(--ds-color-border-default); border-radius: var(--ds-radius-base); background: var(--ds-color-surface-panel); color: var(--ds-color-text-body); font: inherit; font-size: var(--ds-font-size-ui-md); }
  .btn:hover { background: var(--ds-color-fill-hover); }
  .panel { position: absolute; top: 0; right: 0; bottom: 0; width: calc(var(--ds-space-16) * 3); overflow: hidden; border-left: 1px solid var(--ds-color-border-default); background: var(--ds-color-surface-page); }
  .panel-body { padding: var(--ds-space-3); font-size: var(--ds-font-size-ui-md); line-height: var(--ds-line-height-ui); }
  .panel-body p { margin: 0 0 var(--ds-space-2); }
  .muted { color: var(--ds-color-text-muted); }
  .panel { transform: translateX(100%); opacity: 0; transition-property: transform, opacity; transition-duration: var(--ds-motion-duration-slow); transition-timing-function: var(--ds-motion-easing-emphasized); }
  .panel.open { transform: none; opacity: 1; }
  .btn { transition: background-color var(--ds-motion-duration-fast) var(--ds-motion-easing-standard); }
</style>
</head>
<body>
  <div class="view">
    <div class="main">
      <h2 class="title">Q3 report.pdf</h2>
      <button class="btn toggle" type="button" aria-expanded="false">Show details</button>
    </div>
    <aside class="panel" aria-label="Details">
      <div class="panel-body">
        <p><span class="muted">Owner</span> Ford Lascari</p>
        <p><span class="muted">Updated</span> 2 hours ago</p>
        <p><span class="muted">Size</span> 2.4 MB</p>
      </div>
    </aside>
  </div>
  <script>
    const toggle = document.querySelector(".toggle");
    toggle.addEventListener("click", () => {
      const open = document.querySelector(".panel").classList.toggle("open");
      toggle.setAttribute("aria-expanded", String(open));
    });
  </script>
</body>
</html>
