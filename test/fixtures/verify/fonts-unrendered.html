<!doctype html>
<!-- verify:apps fixture: Inter and IBM Plex Mono are declared from the package's fonts/, but no text uses either, so only a forced load would load them. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>fonts declared, not rendered</title>
    <style>
      @font-face { font-family: "Inter"; font-weight: 400; src: url("/fonts/Inter-Regular.woff2") format("woff2"); }
      @font-face { font-family: "IBM Plex Mono"; font-weight: 400; src: url("/fonts/IBMPlexMono-Regular.woff2") format("woff2"); }
      body { margin: 0; font-family: Georgia, serif; }
    </style>
  </head>
  <body>
    <p>Text in a system serif.</p>
  </body>
</html>
