<!doctype html>
<!-- verify:apps fixture: a dark-first surface (dark without any switch) with no app shell. -->
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <title>dark-first</title>
    <link rel="stylesheet" href="/tokens.css" />
    <style>
      @font-face { font-family: "Inter"; font-weight: 400; src: url("/fonts/Inter-Regular.woff2") format("woff2"); }
      @font-face { font-family: "IBM Plex Mono"; font-weight: 400; src: url("/fonts/IBMPlexMono-Regular.woff2") format("woff2"); }
      body { margin: 0; background: var(--ds-color-surface-page); color: var(--ds-color-text-body); font-family: var(--ds-font-family-sans); }
      .panel { background: var(--ds-color-surface-panel); border: 1px solid var(--ds-color-border-default); }
      code { font-family: var(--ds-font-family-mono); }
    </style>
  </head>
  <body>
    <div class="panel">Panel <code>mono</code></div>
  </body>
</html>
