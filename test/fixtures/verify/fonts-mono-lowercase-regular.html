<!doctype html>
<!-- verify:apps fixture (Opus fix-round-1 P2-1): after the package's IBM Plex Mono 400 rule, another package's 400 face declared as "ibm plex mono", which the browser renders for the 400 text. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>IBM Plex Mono 400 under a lowercase family name</title>
    <style>
      @font-face { font-family: "Inter"; font-weight: 400; src: url("/fonts/Inter-Regular.woff2") format("woff2"); }
      @font-face { font-family: "IBM Plex Mono"; font-weight: 400; src: url("/fonts/IBMPlexMono-Regular.woff2") format("woff2"); }
      @font-face { font-family: "ibm plex mono"; font-weight: 400; src: url("/copy/text-measure/fonts/IBMPlexMono-Regular.woff2") format("woff2"); }
      body { margin: 0; font-family: Inter, sans-serif; font-weight: 400; }
      code { font-family: "IBM Plex Mono", monospace; font-weight: 400; }
    </style>
  </head>
  <body>
    <p>Text in Inter, <code>regular code</code>.</p>
  </body>
</html>
